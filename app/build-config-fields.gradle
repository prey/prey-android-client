ext.applySharedPreyBuildConfig = { config, overrides = [:] ->
    Map<String, Object> resolvedValues = new LinkedHashMap<>(preyBuildConfigValues)
    overrides.each { key, value ->
        resolvedValues.put(key.toString(), value)
    }

    resolvedValues.each { key, value ->
        if (value instanceof Boolean) {
            config.buildConfigField "boolean", key, value.toString()
        } else if (value instanceof Integer) {
            config.buildConfigField "int", key, value.toString()
        } else {
            config.buildConfigField "String", key, asBuildConfigString(value)
        }
    }
}
