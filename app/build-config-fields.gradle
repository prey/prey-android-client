String asBuildConfigString(String value) {
    return "\"${value.replace("\\", "\\\\").replace("\"", "\\\"")}\""
}

ext.resolveStringOverride = { Project project, String propertyName, String envName, String defaultValue ->
    if (project.hasProperty(propertyName)) {
        return project.property(propertyName)?.toString() ?: defaultValue
    }
    String envValue = System.getenv(envName)
    return envValue != null ? envValue : defaultValue
}

